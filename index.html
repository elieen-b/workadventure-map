<!DOCTYPE html>
<html>
<head>
  <title>Meine Insel Karte</title>
</head>
<body>

<h2>Insel Karte</h2>
<p>
  JSON-Datei auswählen:
  <input type="file" id="fileInput" accept=".json">
</p>
<canvas id="mapCanvas"></canvas>
<script>
function drawMap(map) {
const layer = map.layers 
   ? (map.layers.find(l => l.name === "tiles") ||
    map.layers.find(l => l.type === "tilelayer"))
   : null;
   const data = map.index || (layer ? layer.data : null);
   console.log("Unique values:", [...new Set(data)]);
   const width = map.width;
   const height = map.height;
   const tileSize = 8;
   const isTiledMap = !!map.layers;
    if (!data || !width || !height) {
    alert("Die JSON-Datei enthält keine gültigen Kartendaten.");
   return;
     }

   const canvas = document.getElementById("mapCanvas");
  canvas.width = width * tileSize;
  canvas.height = height * tileSize;
  const ctx = canvas.getContext("2d");
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const value = data[y * width + x];
      if (isTiledMap) {

if (value === 1) {
  ctx.fillStyle = "#4da6ff"; // Wasser
} else if (value === 2) {
  ctx.fillStyle = "#66cc66"; // Land
} else {
  ctx.fillStyle = "#d9b38c"; // Küste
}

} else {

if (value === 0) {
  ctx.fillStyle = "#4da6ff"; // Wasser
} else if (value === 1) {
  ctx.fillStyle = "#66cc66"; // Land
} else {
  ctx.fillStyle = "#d9b38c"; // Küste
}

}
      ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
    }

  }
  const placesLayer = map.layers
    ? map.layers.find(l => l.name === "places")
    : null;
if (placesLayer && placesLayer.objects)
 {
    placesLayer.objects.forEach(place => {
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(place.x, place.y, 5, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = "black";
        ctx.font = "12px Arial";
        ctx.fillText(place.name, place.x + 8, place.y - 8);
    }); 
 }
}

fetch("ruegen-map.json")
  .then(response => response.json())
  .then(map => drawMap(map))
  .catch(error => {
    document.body.innerHTML += "<p>Fehler beim Laden der Standardkarte.</p>";
    console.error(error);
  });

document.getElementById("fileInput").addEventListener("change", function(event) {
  const file = event.target.files[0];
  if (!file) {
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const map = JSON.parse(e.target.result);
      drawMap(map);
    } catch (error) {
      alert("Die ausgewählte Datei ist kein gültiges JSON.");
      console.error(error);
    }
  };
  reader.readAsText(file);
});
</script>

</body>
</html>
