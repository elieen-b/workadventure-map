<!DOCTYPE html>
<html>
<head>
  <title>Meine Insel Karte</title>
</head>
<body>

<h2>Insel Karte</h2>
<p>
  JSON-Datei auswählen:
  <input type="file" id="fileInput" accept=".json">
</p>

<canvas id="mapCanvas"></canvas>

<script>
function drawMap(map) {
  const layer = map.layers
    ? (map.layers.find(l => l.name === "tiles") ||
       map.layers.find(l => l.type === "tilelayer"))
    : null;

  const data = map.index || (layer ? layer.data : null);
  const width = map.width;
  const height = map.height;
  const tileSize = 8;
  const isTiledMap = !!map.layers;

  if (!data || !width || !height) {
    alert("Die JSON-Datei enthält keine gültigen Kartendaten.");
    return;
  }

  const canvas = document.getElementById("mapCanvas");
  canvas.width = width * tileSize;
  canvas.height = height * tileSize;

  const ctx = canvas.getContext("2d");

  function isLandPixel(pixelX, pixelY) {
  const tileX = Math.floor(pixelX / tileSize);
  const tileY = Math.floor(pixelY / tileSize);

  if (
    tileX < 0 ||
    tileY < 0 ||
    tileX >= width ||
    tileY >= height
  ) {
    return false;
  }

  const tileValue = data[tileY * width + tileX];

  if (isTiledMap) {
    return tileValue !== 1;
  }

  return tileValue !== 0;
}
  function getLabelText(label) {
    let value = label.text;

    while (value && typeof value === "object") {
      value = value.text;
    }

    return typeof value === "string" ? value : "";
  
  }
  // Tiles zeichnen
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const value = data[y * width + x];

      if (isTiledMap) {
        if (value === 1) {
          ctx.fillStyle = "#4da6ff"; // Wasser
        } else if (value === 2) {
          ctx.fillStyle = "#66cc66"; // Land
        } else {
          ctx.fillStyle = "#d9b38c"; // Küste
        }
      } else {
        if (value === 0) {
          ctx.fillStyle = "#4da6ff"; // Wasser
        } else if (value === 1) {
          ctx.fillStyle = "#66cc66"; // Land
        } else {
          ctx.fillStyle = "#d9b38c"; // Küste
        }
      }

      ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
    }
  }
  
  // Straßen zeichnen
  console.log(map.layers);
  
  const roadsLayer = map.layers
    ? map.layers.find(l => l.name === "roads")
    : null;

  if (roadsLayer && roadsLayer.objects) {
    roadsLayer.objects.forEach(road => {
      if (!road.polyline || road.polyline.length < 2) {
        return;
      }
       
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      let outerWidth = 5;
      let innerWidth = 3;
      let innerColor = "#f7f3e8";
      let centerColor = null;

      if (road.type === "motorway" || road.type === "trunk") {
        outerWidth = 9;
        innerWidth = 6;
        innerColor = "#f6b26b";
        centerColor = "#ffffff";
      
      } else if (road.type === "primary") {
        outerWidth = 8;
        innerWidth = 5;
        innerColor = "#ffd966";
        centerColor = "#ffffff";

      } else if (road.type === "secondary") {
        outerWidth = 7;
        innerWidth = 4;
        innerColor = "#fff2cc";

      } else if (road.type === "tertiary") {
        outerWidth = 6;
        innerWidth = 3;
        innerColor = "#f7f3e8";
      }

      function drawRoadPath() {
        ctx.beginPath();
        ctx.moveTo(road.polyline[0].x, road.polyline[0].y);
        
        for (let i = 1; i < road.polyline.length; i++) {
          ctx.lineTo(road.polyline[i].x, road.polyline[i].y);
        }
      }

      // Außenrand
      ctx.strokeStyle = "#6b6255";
      ctx.lineWidth = outerWidth;
      ctx.setLineDash([]);
      drawRoadPath();
      ctx.stroke();

      // Straßenfläche
      ctx.strokeStyle = innerColor;
      ctx.lineWidth = innerWidth;
      ctx.setLineDash([]);
      drawRoadPath();
      ctx.stroke();

      // Mittellinie nur für große Straßen
      if (centerColor) {
        ctx.strokeStyle = centerColor;
        ctx.lineWidth = 1;
        ctx.setLineDash([6, 5]);
        drawRoadPath();
        ctx.stroke();

      }

      ctx.restore();


      
    });
  }

  // Orte zeichnen
  const placesLayer = map.layers
    ? map.layers.find(l => l.name === "places")
    : null;

  if (placesLayer && placesLayer.objects) {
    placesLayer.objects.forEach(place => {
      const scale = tileSize / 32;
      const placeX = place.x * scale;
      const placeY = place.y * scale;
      const placeSize = place.size || place.width || 10;
      let placeColor = "#ffd43b";

      if (place.type === "city") {
        placeColor = "#d7191c";
      } else if (place.type === "town") {
        placeColor = "#ff8c00";
      } else if (place.type === "village") {
        placeColor = "#ffd43b";
      }

      const radius = Math.max(
        4,
        placeSize * scale * 0.75
      );

      ctx.save();

      ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
      ctx.shadowBlur = 3;
      ctx.shadowOffsetX = 1;
      ctx.shadowOffsetY = 1;

      ctx.fillStyle = placeColor;
      ctx.beginPath();
      ctx.arc(placeX, placeY, radius, 0, 2 * Math.PI);
      ctx.fill();

      ctx.shadowColor = "transparent";

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.strokeStyle = "#333333";
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.restore();



    });
  }
  // Straßenlabels zeichnen
  const roadLabelsLayer = map.layers
    ? map.layers.find(l => l.name === "roadLabels")
    : null;

// Straßenlabels erstmal nicht zeichnen, sonst wird die Karte zu voll

if (roadLabelsLayer && roadLabelsLayer.objects) {

const scale = tileSize / 32;

const usedPositions = [];

roadLabelsLayer.objects.forEach(label => {

  const text = getLabelText(label);

  if (!text) {
    return;
  }

  
  
  if (text.length > 16) {
    return;
  }

  const x = label.x * scale;
  const y = label.y * scale;

  const tooClose = usedPositions.some(pos => {
    const dx = pos.x - x;
    const dy = pos.y - y;
    return Math.sqrt(dx * dx + dy * dy) < 45;
  });
  if (tooClose) {
    return;
  }
  

  if (!isLandPixel(x, y)) {
    return;
  }

  usedPositions.push({ x, y });

  ctx.save();

  ctx.font = "bold 7px Arial";

  const paddingX = 4;
  const textWidth = ctx.measureText(text).width;

  const labelX = x + 3;
  const labelY = y - 10;
  const boxWidth = textWidth + paddingX * 2;
  const boxHeight = 11;

  ctx.fillStyle = "rgba(235, 245, 255, 0.92)";
  ctx.fillRect(
    labelX - paddingX,
    labelY - 8,
    boxWidth,
    boxHeight
);

ctx.strokeStyle = "#4a6f91";
ctx.lineWidth = 0.8;
ctx.strokeRect(
  labelX - paddingX,
  labelY - 8,
  boxWidth,
  boxHeight
);

ctx.fillStyle = "#24445f";
ctx.fillText(text, labelX, labelY);

ctx.restore();


});
}
  
  // Ortslabels zeichnen
  const placeLabelsLayer = map.layers
    ? map.layers.find(l => l.name === "placeLabels" && l.visible !== false)
    : null;

    if (placeLabelsLayer && placeLabelsLayer.objects) {
      const scale = tileSize / 32;

     placeLabelsLayer.objects.forEach(label => {

      const text = getLabelText(label);
      if (!text) {
        return;
      }

     if (text.length > 12) {
     return;
     }

     const labelX = label.x * scale + 5;
     const labelY = label.y * scale - 5;

     ctx.save();

     ctx.font = "bold 9px Arial";
     ctx.lineJoin = "round";

     ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
     ctx.lineWidth = 3;
     ctx.strokeText(text, labelX, labelY);

     ctx.fillStyle = "#1d1d1d";
     ctx.fillText(text, labelX, labelY);

     ctx.restore();

    });

  }
}

fetch("ruegen-map.json")
  .then(response => response.json())
  .then(map => drawMap(map))
  .catch(error => {
    document.body.innerHTML += "<p>Fehler beim Laden der Standardkarte.</p>";
    console.error(error);
  });

document.getElementById("fileInput").addEventListener("change", function(event) {
  const file = event.target.files[0];

  if (!file) {
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {
    try {
      const map = JSON.parse(e.target.result);
      drawMap(map);
    } catch (error) {
      alert("Die ausgewählte Datei ist kein gültiges JSON.");
      console.error(error);
    }
  };

  reader.readAsText(file);
});
</script>

</body>
</html>
